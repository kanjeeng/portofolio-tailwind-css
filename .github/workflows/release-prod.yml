name: Release - Promote ke Production

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  IMAGE_NAME: portofolio-tailwind-css

jobs:
  promote:
    name: Promote image (tanpa rebuild) + PR ke GitOps
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pastikan tag berasal dari main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - id: meta
        run: |          
          echo "sha7=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image=${{ vars.DOCKERHUB_USERNAME }}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Pastikan image hasil pipeline main ada
        run: docker buildx imagetools inspect ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha7 }}
      - name: Re-scan Trivy saat promosi (CVE baru bisa muncul setelah build)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha7 }}
          severity: HIGH,CRITICAL
          scanners: vuln
          ignore-unfixed: true
          exit-code: "1"
      - name: Beri tag versi (image sama, digest sama)
        run: |
          docker buildx imagetools create \
            -t ${{ steps.meta.outputs.image }}:${GITHUB_REF_NAME} \
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha7 }}
      - name: Buka Pull Request ke repo GitOps (overlay prod)
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git clone https://x-access-token:${GH_TOKEN}@://github.com gitops
          cd gitops
          git checkout -b release/portofolio-${TAG}
          yq -i '.images[0].newTag = strenv(TAG)' apps/portofolio/overlays/prod/kustomization.yaml
          git add -A
          git commit -m "release(portofolio): prod -> ${TAG}"
          git push origin release/portofolio-${TAG}
          gh pr create --repo kanjeeng/gitops-argocd-lab --base main \
            --head release/portofolio-${TAG} \
            --title "release(portofolio): promote ${TAG} ke production" \
            --body "Image: ${{ steps.meta.outputs.image }}:${TAG} (sumber SHA ${GITHUB_SHA}). Merge PR ini = deploy ke production via ArgoCD."
